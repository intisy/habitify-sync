name: Deploy

# Deliberately manual. Deploy-on-push would overwrite a live, working worker
# with no review gate, and this worker is somebody's daily habit tracking —
# a bad merge should not silently take it down. Trigger from the Actions tab
# once a change has been reviewed.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Never ship a version that does not pass its own checks.
      - run: npm run typecheck
      - run: npm test

      # Entirely optional: deploying from a developer machine works without any
      # API token, because `wrangler login` holds an OAuth session there. A
      # token exists only for CI, which has no browser to log in with. Fail with
      # a clear message rather than an opaque wrangler auth error.
      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set, so CI cannot deploy."
            echo "Either run 'npm run deploy' locally (no token needed), or create a"
            echo "token at Cloudflare > My Profile > API Tokens > Edit Cloudflare Workers"
            echo "and add it with: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Supplied via env rather than committed to wrangler.toml so the
          # account id stays out of a public repository.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
