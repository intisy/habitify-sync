version: 2

# The wrangler / @cloudflare/vitest-pool-workers / vitest trio has conflicting
# peer ranges that have broken installs here before, so updates are grouped:
# one PR that CI can prove installs and passes, rather than three that each
# half-satisfy the others.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cloudflare-toolchain:
        patterns:
          - wrangler
          - "@cloudflare/*"
          - vitest
