name = "habitify-sync"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

[vars]
TIMEZONE = "Europe/Berlin"
HABIT_ID_STRAVA = ""
HABIT_ID_WAKATIME = ""
HABIT_ID_KINDLE = ""
KINDLE_POSITIONS_PER_PAGE = "1800"
KINDLE_WORDS_PER_PAGE = "250"
# OPTIONAL OVERRIDE, not the primary mechanism: printed page counts are discovered automatically
# from each book's Amazon product page and cached, so this normally needs no entries at all. Only
# fill it in to rescue a specific book if that automatic discovery fails (e.g. Amazon blocks the
# Worker's request) — JSON object mapping asin -> printed page count, e.g.
# {"B009ZUZ9FW":272,"B013UWFM52":304}. See src/integrations/kindle/README.md.
KINDLE_PAGE_COUNTS = ""

[[kv_namespaces]]
binding = "STATE"
id = "90b1bdd9db2d46b3a70d99fe53b22e5f"
