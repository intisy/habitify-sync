name = "habitify-sync"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

[vars]
TIMEZONE = "Europe/Berlin"
HABIT_ID_STRAVA = ""
HABIT_ID_WAKATIME = ""
HABIT_ID_KINDLE = ""
KINDLE_POSITIONS_PER_PAGE = "1800"
KINDLE_WORDS_PER_PAGE = "250"
# JSON object mapping asin -> printed page count, e.g. {"B009ZUZ9FW":272,"B013UWFM52":304}.
# Enables the exact print-pages derivation for those books; see src/integrations/kindle/README.md.
KINDLE_PAGE_COUNTS = ""

[[kv_namespaces]]
binding = "STATE"
id = "0000000000000000000000000000000000000000"
